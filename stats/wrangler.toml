name = "openwren-stats"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Do not publish on the *.workers.dev address; the service is reached only at
# its own domain (see the route below).
workers_dev = false
preview_urls = false

# Privacy: Workers observability and logs stay OFF. The service keeps counters
# only; turning logs on would have Cloudflare keep a record of each request
# (address, headers, time), which is exactly what this service promises not to
# keep. Do not enable this, Logpush, or `wrangler tail` sampling in production.
[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false

[[d1_databases]]
binding = "DB"
database_name = "openwren-stats"
database_id = "39744b72-f4b0-40d2-b609-698ce632e51a"
migrations_dir = "migrations"

# The service's own address; attached on `wrangler deploy`.
[[routes]]
pattern = "stats.openwren.app"
custom_domain = true

name = "openwren-stats"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Do not publish on the *.workers.dev address; the service is reached only at
# its own domain (see the route below).
workers_dev = false
preview_urls = false

# Privacy: Workers observability and logs stay OFF. The service keeps counters
# only; turning logs on would have Cloudflare keep a record of each request
# (address, headers, time), which is exactly what this service promises not to
# keep. Do not enable this, Logpush, or `wrangler tail` sampling in production.
[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false

[[d1_databases]]
binding = "DB"
database_name = "openwren-stats"
# Replace with the id printed by `wrangler d1 create openwren-stats` before
# deploying. Local development (`wrangler dev --local`) does not use it.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Uncomment when deploying, once the openwren.org zone is on the Cloudflare
# account. This attaches the custom domain on `wrangler deploy`.
# [[routes]]
# pattern = "stats.openwren.org"
# custom_domain = true

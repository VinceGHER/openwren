# Serves the apt and rpm repositories: read-only access to the files in the
# R2 bucket, at packages.openwren.app. Deploy with `pnpm dlx wrangler deploy`.
name = "openwren-packages"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false

# Like the usage counter, this keeps no record of who downloads what.
[observability]
enabled = false

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "openwren-packages"

[[routes]]
pattern = "packages.openwren.app"
custom_domain = true

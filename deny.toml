# Checked by `cargo deny --manifest-path src-tauri/Cargo.toml check`.
# OpenWren is Apache-2.0. Every dependency must be under a licence that allows
# shipping it that way: no GPL, AGPL, LGPL or other strong copyleft.

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unlicense",
  "CC0-1.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  # File-level copyleft: fine as long as those files are used unmodified.
  "MPL-2.0",
]
confidence-threshold = 0.9

[advisories]
yanked = "warn"

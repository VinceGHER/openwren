<!doctype html>
<!-- The README banner. scripts/screenshots.mjs renders this page to docs/cover.png. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Inter";
        src: url("../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
      }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: "Inter", system-ui, sans-serif;
        background: #256ef3;
        color: #fff;
        display: flex;
        overflow: hidden;
      }
      .text { width: 520px; padding: 0 0 0 72px; display: flex; flex-direction: column; justify-content: center; flex: none; }
      .brand { display: flex; align-items: center; gap: 16px; font-size: 34px; }
      .brand img { width: 60px; height: 60px; border-radius: 15px; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35); }
      h1 { font-size: 52px; line-height: 1.08; font-weight: 600; margin: 34px 0 18px; letter-spacing: -0.02em; }
      p { font-size: 21px; line-height: 1.45; margin: 0; color: #dbe7ff; }
      .tags { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; }
      .tags span { font-size: 15px; padding: 7px 14px; border-radius: 999px; background: rgba(255, 255, 255, 0.16); }
      .shot { position: relative; flex: 1; }
      .shot img {
        position: absolute; left: 56px; top: 76px; width: 1040px;
        border-radius: 14px; box-shadow: 0 30px 80px rgba(8, 30, 90, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.25);
      }
    </style>
  </head>
  <body>
    <div class="text">
      <div class="brand"><img src="../design/openwren-logo.svg" alt="" />OpenWren</div>
      <h1>Mail that stays yours</h1>
      <p>A free, open-source mail app for Linux. Private by design, built with Rust and React.</p>
      <div class="tags"><span>Gmail and IMAP</span><span>Encrypted on your computer</span><span>Blocks trackers</span></div>
    </div>
    <div class="shot"><img src="../docs/inbox.png" alt="" /></div>
  </body>
</html>

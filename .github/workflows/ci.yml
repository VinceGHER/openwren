name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  # Automated runs never send the anonymous usage request.
  OPENWREN_NO_STATS: "1"

jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # A local Dovecot (IMAP) and a small SMTP sink, filled with test mail.
      - run: sh tests/mail-server.sh
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          OPENWREN_TEST_IMAP: 127.0.0.1:3143
          OPENWREN_TEST_SMTP: 127.0.0.1:3025

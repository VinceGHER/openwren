name: Packages

# Builds the .deb and .rpm once, then installs each in clean containers and
# runs `openwren --version`.

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      OPENWREN_NO_STATS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev pkg-config rpm

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build --bundles deb,rpm

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          if-no-files-found: error
          retention-days: 3
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  install:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            kind: deb
          - image: ubuntu:24.04
            kind: deb
          - image: debian:12
            kind: deb
          - image: fedora:latest
            kind: rpm
    container:
      image: ${{ matrix.image }}
    env:
      OPENWREN_NO_STATS: "1"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - name: Install the .deb
        if: matrix.kind == 'deb'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y ./packages/deb/*.deb

      - name: Install the .rpm
        if: matrix.kind == 'rpm'
        run: dnf install -y ./packages/rpm/*.rpm

      - name: Run openwren --version
        run: |
          out=$(openwren --version)
          echo "$out"
          echo "$out" | grep -Eq '^openwren [0-9]+\.[0-9]+\.[0-9]+'

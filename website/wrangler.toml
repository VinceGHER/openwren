# The website: the static files in dist/, served at openwren.app.
# Build first (`pnpm build`), then `pnpm dlx wrangler deploy`.
name = "openwren-website"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
not_found_handling = "404-page"

[[routes]]
pattern = "openwren.app"
custom_domain = true

[[routes]]
pattern = "www.openwren.app"
custom_domain = true

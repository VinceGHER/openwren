[package]
name = "openwren"
version = "0.1.6"
description = "An open-source desktop mail client"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "openwren_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = "1.16.0"
webpki-roots = "1.0.12"
futures = "0.3.34"
mail-parser = "0.11.9"
ammonia = "4.0.3"
# Passwords live in the system store: the secret service on Linux, the Keychain on macOS,
# the Credential Manager on Windows.
keyring = { version = "3.6.3", features = ["async-secret-service", "tokio", "crypto-rust", "apple-native", "windows-native"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tauri-plugin-opener = "2.5.5"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls", "ring", "webpki-roots"] }
tauri-plugin-dialog = "2.7.3"
sha2 = "0.10.9"
base64 = "0.23.1"
getrandom = "0.3.4"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls-no-provider", "form", "json"] }
tauri-plugin-notification = "2.4.0"
tauri-plugin-single-instance = "2.4.5"
# Installs signed updates where the system has no package manager for it (AppImage, Windows, macOS).
tauri-plugin-updater = "2"

# Start at login. Linux writes its own autostart entry (src/autostart.rs).
[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"

[dev-dependencies]
# For the test that checks published updates against the update key.
minisign-verify = "0.2"

[[bench]]
name = "engine"
harness = false
